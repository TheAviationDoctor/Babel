# THE LIBRARY OF BABEL — world configuration
#
# Edit the values below, save, and reload the page. They are read once, when
# the Library is built. Every combination of values describes a different
# Library, and the same values always describe the same one.
#
# Lines starting with # are comments and are ignored.

# Decides which book stands on which shelf. Any word or number. The seed can
# also be changed from the title screen and from the pause menu.
seed: borges

book:
  pages per book: 512
  lines per page: 32
  characters per line: 64

# The symbols the books are written in, in this order. Each may appear only
# once. Here: the 26 letters, then colon, comma, exclamation mark, period,
# question mark, and a space (the last character before the closing quote).
# Keep the quotes: they make the punctuation and the space part of the text.
alphabet: "ABCDEFGHIJKLMNOPQRSTUVWXYZ:,!.? "

hexagon:
  walls with shelves: 4    # from 1 to 4; the two other sides are the doors
  shelves per wall: 4
  books per shelf: 32
